<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>História - Lord of Tree</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      background-color: #1a1a1a;
      color: #e0d8c3;
      font-family: 'Georgia', serif;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
      background-color: rgba(20, 20, 20, 0.85);
      border: 2px solid #444;
      border-radius: 10px;
    }
    img.header-img {
      display: block;
      margin: 0 auto 20px auto;
      max-width: 100%;
      height: auto;
      border: 2px solid #555;
      border-radius: 8px;
      box-shadow: 0 0 15px #9c8c5a;
    }
    h1, h2 {
      color: #d4c28a;
      text-align: center;
    }
    ul {
      list-style-type: square;
      padding-left: 20px;
    }
    strong {
      color: #f3e6b2;
    }
  </style>
</head>

    />
